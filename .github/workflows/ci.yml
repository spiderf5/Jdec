name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Lint undefined names, unused imports/vars, f-strings and bugbear
        # Rules live in pyproject.toml ([tool.ruff.lint]) so a local run and CI
        # cannot drift: F = undefined/unused, B = bugbear, E9 = syntax errors.
        run: |
          ruff check src/jdec src/tests java-deobf/scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Prepare decompiler engines
        run: |
          python jdec.py engines

      - name: Test CLI entrypoint
        run: |
          jdec --help
          jdec --version

      - name: Skill self-test
        run: |
          python java-deobf/scripts/self_test.py

      - name: Run test suite
        run: |
          python src/tests/run_tests.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . -w dist --no-deps
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/jdec-wheel-venv
          /tmp/jdec-wheel-venv/bin/pip install dist/jdec-*.whl
      - name: Version and engines from the wheel install
        run: |
          /tmp/jdec-wheel-venv/bin/jdec --version
          /tmp/jdec-wheel-venv/bin/jdec engines | tee engines.txt
          grep -q 'CFR 0.152.*available' engines.txt
          grep -q 'Vineflower 1.11.1.*available' engines.txt
          grep -q 'Procyon 0.6.0.*available' engines.txt
      - name: Engine cache must not live under site-packages
        run: |
          test ! -d /tmp/jdec-wheel-venv/lib/python3.11/site-packages/engines
      - name: Build fixtures
        # src/tests/*.jar is gitignored, so a fresh checkout has none and the
        # probe below would fail with "no such file". run_tests.py builds them
        # itself; this job never runs the suite, so it must ask explicitly.
        run: |
          python src/tests/build_fixtures.py
      - name: Probe a fixture with the wheel install
        run: |
          /tmp/jdec-wheel-venv/bin/jdec probe src/tests/sample.jar
      - name: Gates must pass from a clean install
        # The suite proves the gates work against the in-tree fixtures; this
        # proves they work through the console script and the installed package
        # data (the engine bridge, web assets, fingerprints.json).
        # flow.jar, not sample.jar: sample ships a truncated class on purpose,
        # so ircheck answers PARTIAL (exit 3) and verify reports it INVALID.
        run: |
          /tmp/jdec-wheel-venv/bin/jdec ircheck src/tests/flow.jar
          /tmp/jdec-wheel-venv/bin/jdec verify src/tests/flow.jar

  offline-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel and install into a clean venv
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . -w dist --no-deps
          python -m venv /tmp/jdec-offline-venv
          /tmp/jdec-offline-venv/bin/pip install dist/jdec-*.whl
      - name: Build an offline engine bundle (network allowed here, once)
        # This is the only networked step of the offline path. Everything
        # after it runs with a dead proxy, so a stray download fails loudly.
        run: |
          set -euo pipefail
          python scripts/verify_engine_bundle.py --build "$RUNNER_TEMP/jdec-engines" | tee bundle.txt
          grep -q 'overall   : OK' bundle.txt
          python scripts/verify_engine_bundle.py --verify "$RUNNER_TEMP/jdec-engines" | tee verify.txt
          grep -q 'overall   : OK' verify.txt
      - name: A tampered jar must fail verification
        run: |
          cp -r "$RUNNER_TEMP/jdec-engines" "$RUNNER_TEMP/jdec-engines-bad"
          printf x >> "$RUNNER_TEMP/jdec-engines-bad/cfr-0.152.jar"
          if python scripts/verify_engine_bundle.py --verify "$RUNNER_TEMP/jdec-engines-bad"; then
            echo "tampered bundle was accepted" >&2
            exit 1
          fi
      - name: Install engines with the network cut
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
          JDEC_OFFLINE: "1"
        run: |
          set -euo pipefail
          CACHE="$RUNNER_TEMP/jdec-offline-cache"
          /tmp/jdec-offline-venv/bin/jdec --engines-dir "$CACHE" engines \
              --offline --from-dir "$RUNNER_TEMP/jdec-engines" \
              --json engines.json | tee engines.txt
          # Structured assertion: catches a failed install even when the
          # three "available" lines are printed (e.g. a failed Procyon bridge).
          python -c "import json,sys; d=json.load(open('engines.json')); sys.exit(0 if not d['missing'] and not d['unavailable'] and d['bundle']['ok'] else 1)"
          test ! -d /tmp/jdec-offline-venv/lib/python3.11/site-packages/engines
      - name: Gates pass from the offline install
        # flow.jar, not sample.jar: sample ships a truncated class on purpose.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
          JDEC_OFFLINE: "1"
        run: |
          set -euo pipefail
          python src/tests/build_fixtures.py
          CACHE="$RUNNER_TEMP/jdec-offline-cache"
          /tmp/jdec-offline-venv/bin/jdec --engines-dir "$CACHE" ircheck src/tests/flow.jar
          /tmp/jdec-offline-venv/bin/jdec --engines-dir "$CACHE" verify src/tests/flow.jar

  support-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The real corpora are external and authorised; CI only proves the
      # registry and its negative controls still work with in-repo fixtures.
      - name: Build fixtures
        run: python src/tests/build_fixtures.py
      # The support matrix harness lives in src/tests/ and is deliberately
      # NOT shipped in the wheel, so this job imports from the source tree.
      - name: Support matrix negative controls
        run: |
          set -euo pipefail
          python src/tests/support_matrix.py --selfcheck --json matrix-selfcheck.json
          python -c "import json; d=json.load(open('matrix-selfcheck.json')); assert d['verdict']=='PASS' and d['stage_04_threshold_met'] is False and len(d['negative_controls'])==2"
      # The 04 acceptance runner needs external corpora; CI proves only that
      # its independent goldens and unit-level controls still work.
      - name: Stage 04 acceptance selfcheck
        run: python src/tests/stage04.py --selfcheck

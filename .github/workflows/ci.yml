name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Lint undefined names, unused imports/vars, f-strings and bugbear
        # Rules live in pyproject.toml ([tool.ruff.lint]) so a local run and CI
        # cannot drift: F = undefined/unused, B = bugbear, E9 = syntax errors.
        run: |
          ruff check src/jdec src/tests java-deobf/scripts

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Prepare decompiler engines
        run: |
          python jdec.py engines

      - name: Test CLI entrypoint
        run: |
          jdec --help
          jdec --version

      - name: Skill self-test
        run: |
          python java-deobf/scripts/self_test.py

      - name: Run test suite
        run: |
          python src/tests/run_tests.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . -w dist --no-deps
      - name: Install the wheel into a clean venv
        run: |
          python -m venv /tmp/jdec-wheel-venv
          /tmp/jdec-wheel-venv/bin/pip install dist/jdec-*.whl
      - name: Version and engines from the wheel install
        run: |
          /tmp/jdec-wheel-venv/bin/jdec --version
          /tmp/jdec-wheel-venv/bin/jdec engines | tee engines.txt
          grep -q 'CFR 0.152.*available' engines.txt
          grep -q 'Vineflower 1.11.1.*available' engines.txt
          grep -q 'Procyon 0.6.0.*available' engines.txt
      - name: Engine cache must not live under site-packages
        run: |
          test ! -d /tmp/jdec-wheel-venv/lib/python3.11/site-packages/engines
      - name: Build fixtures
        # src/tests/*.jar is gitignored, so a fresh checkout has none and the
        # probe below would fail with "no such file". run_tests.py builds them
        # itself; this job never runs the suite, so it must ask explicitly.
        run: |
          python src/tests/build_fixtures.py
      - name: Probe a fixture with the wheel install
        run: |
          /tmp/jdec-wheel-venv/bin/jdec probe src/tests/sample.jar
      - name: Gates must pass from a clean install
        # The suite proves the gates work against the in-tree fixtures; this
        # proves they work through the console script and the installed package
        # data (the engine bridge, web assets, fingerprints.json).
        # flow.jar, not sample.jar: sample ships a truncated class on purpose,
        # so ircheck answers PARTIAL (exit 3) and verify reports it INVALID.
        run: |
          /tmp/jdec-wheel-venv/bin/jdec ircheck src/tests/flow.jar
          /tmp/jdec-wheel-venv/bin/jdec verify src/tests/flow.jar

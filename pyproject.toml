[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jdec"
dynamic = ["version"]
description = "Multi-engine Java decompiler driver with bytecode-verified output selection"
readme = "docs/README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "jdec contributors"}
]
keywords = [
    "java",
    "decompiler",
    "deobfuscator",
    "minecraft",
    "bytecode",
    "cfr",
    "vineflower",
    "procyon"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Disassemblers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/spiderf5/Jdec"
Issues = "https://github.com/spiderf5/Jdec/issues"

[project.scripts]
jdec = "jdec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "jdec._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["jdec*"]

[tool.setuptools.package-data]
jdec = [
    "fingerprints.json",
    "*.java",
    "*.js",
    "web_assets/*",
    "engines_src/*.java"
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Downloaded engines and generated fixtures are not source.
extend-exclude = ["src/engines", "src/tests/build"]

[tool.ruff.lint]
# Deliberately narrow. This is the set that catches a defect rather than a
# preference: undefined names, dead or shadowed imports, a mutable default, an
# exception swallowed by a bare `except`, a comparison against a literal.
# The tree already has a consistent style; reformatting 40k lines would bury
# the semantic diffs that make a review worth reading.
select = ["F", "E9", "B"]
ignore = [
    "B905",  # zip(strict=) - every call site currently has equal lengths, and
             # the flag would turn a mismatch into a new exception path
    "B007",  # unused loop variable is often intentional here (`for _ in ...`)
]
